[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gensprite-mcp"
version = "1.0.0"
description = "Agent-authored sprite production, animation, refinement and exports over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "Pillow>=12.1,<13", "pydantic>=2.10,<3"]

[project.scripts]
gensprite-mcp = "gensprite_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/gensprite_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml", "/uv.lock", "/docs/deployment.md", "/docs/compatibility.md"]
